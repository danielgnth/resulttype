# yaml-language-server: $schema=https://raw.githubusercontent.com/evilmartians/lefthook/master/schema.json

pre-commit:
  parallel: true
  commands:
    secrets:
      run: pnpm exec gitleaks-secret-scanner
    format:
      glob: "*.{ts,tsx,json}"
      run: pnpm exec biome check --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    conventional:
      run: pnpm run commitlint -- --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm run typecheck
    lint:
      run: pnpm run lint
    test:
      run: pnpm run test
